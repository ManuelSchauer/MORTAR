CDKCircularFragmenter.markAttachmentsSetting.displayName = Mark attachments setting
CDKCircularFragmenter.applyAromaticityDetectionSetting.tooltip = Defines whether aromaticity detection should be applied as preprocessing before fragmentation using the configured electron donation model and cycle finder algorithm; if turned off, the aromaticity information already present in the input molecule is used as-is
CDKCircularFragmenter.applyAromaticityDetectionSetting.displayName = Apply aromaticity detection setting
CDKCircularFragmenter.electronDonationModelSetting.tooltip = Defines which CDK electron donation model should be used for aromaticity detection; only relevant if aromaticity detection is turned on
CDKCircularFragmenter.electronDonationModelSetting.displayName = Electron donation model setting
CDKCircularFragmenter.cycleFinderSetting.tooltip = Defines which CDK cycle finder algorithm should be used for aromaticity detection; only relevant if aromaticity detection is turned on
CDKCircularFragmenter.cycleFinderSetting.displayName = Cycle finder algorithm setting
