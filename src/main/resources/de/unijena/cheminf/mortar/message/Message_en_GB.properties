SugarRemovalUtilityFragmenter.limitPostprocessingBySizeSetting.displayName = Limit post-processing by size setting
SugarRemovalUtilityFragmenter.limitPostprocessingBySizeSetting.tooltip = Defines whether small substituents should not be split from the extracted sugars in postprocessing. If true, sugar moieties will only be separated/split in postprocessing if they are larger than the set preservation mode threshold to prevent smaller substituents like, e.g. methyl ethers, being separated from the sugars. For linear sugars, the minimum size for linear sugar candidates is applied as a criterion.
SugarRemovalUtilityFragmenter.discardTooSmallSugarModificationsSetting.tooltip = Defines whether too small sugar modifications (i.e. groups that were disconnected in postprocessing) should be discarded if postprocessing is enabled and not(!) limited by size.
SugarRemovalUtilityFragmenter.discardTooSmallSugarModificationsSetting.displayName = Discard too small sugar modifications setting
SugarRemovalUtilityFragmenter.SugarTypeToRemoveOption.Circular.displayName = circular
SugarRemovalUtilityFragmenter.SugarTypeToRemoveOption.Circular.tooltip = remove/detect only circular sugars
SugarRemovalUtilityFragmenter.SugarTypeToRemoveOption.Linear.displayName = linear
SugarRemovalUtilityFragmenter.SugarTypeToRemoveOption.Linear.tooltip = remove/detect only linear sugars
SugarRemovalUtilityFragmenter.SugarTypeToRemoveOption.Both.displayName = circular and linear
SugarRemovalUtilityFragmenter.SugarTypeToRemoveOption.Both.tooltip = remove/detect circular and linear sugars
SugarRemovalUtilityFragmenter.SRUFragmenterReturnedFragmentsOption.OnlySugars.displayName = only sugar moieties
SugarRemovalUtilityFragmenter.SRUFragmenterReturnedFragmentsOption.OnlySugars.tooltip = return only the identified sugar moieties of a molecule after fragmentation
SugarRemovalUtilityFragmenter.SRUFragmenterReturnedFragmentsOption.OnlyAglycone.displayName = only aglycone
SugarRemovalUtilityFragmenter.SRUFragmenterReturnedFragmentsOption.OnlyAglycone.tooltip = return only the identified aglycone of a molecule after fragmentation
SugarRemovalUtilityFragmenter.SRUFragmenterReturnedFragmentsOption.All.displayName = aglycone and sugars
SugarRemovalUtilityFragmenter.SRUFragmenterReturnedFragmentsOption.All.tooltip = return the identified aglycone and sugar moieties of a molecule together after fragmentation
SugarRemovalUtilityFragmenter.SRUFragmenterPreservationMode.All.displayName = preserve all fragments
SugarRemovalUtilityFragmenter.SRUFragmenterPreservationMode.All.tooltip = specifies that all structures should be preserved; note that if this option is combined with the removal of only terminal moieties, even the smallest attached structure will prevent the removal of a sugar; this includes hydroxy groups of sugar moieties because these are not considered as part of the sugar moiety
SugarRemovalUtilityFragmenter.SRUFragmenterPreservationMode.HAC.displayName = heavy atom count
SugarRemovalUtilityFragmenter.SRUFragmenterPreservationMode.HAC.tooltip = Specifies that whether a structure is worth preserving will be judged by its heavy atom count; the default threshold to preserve a structure is set to 5 heavy atoms (inclusive)
SugarRemovalUtilityFragmenter.SRUFragmenterPreservationMode.MW.displayName = molecular weight
SugarRemovalUtilityFragmenter.SRUFragmenterPreservationMode.MW.tooltip = Specifies that whether a structure is worth preserving will be judged by its molecular weight; the default threshold to preserve a structure is set to 60 Da (= 5 carbon atoms, inclusive)
##CDKCircularFragmenter##
CDKCircularFragmenter.displayName = Circular Fragmenter
CDKCircularFragmenter.radiusSetting.tooltip = Defines the radius (number of bonds) of the circular neighborhood to extract around each atom; a radius of 0 produces single-atom fragments
CDKCircularFragmenter.radiusSetting.displayName = Radius setting
CDKCircularFragmenter.includeSmallerRadiiSetting.tooltip = Defines whether circular fragments of all radii up to the one set above (starting at 0) should also be extracted; if turned off, only fragments of the configured radius are extracted
CDKCircularFragmenter.includeSmallerRadiiSetting.displayName = Include smaller radii setting
CDKCircularFragmenter.preserveStereoSetting.tooltip = Defines whether stereochemistry annotations of the input molecule should be preserved in the extracted circular fragments
